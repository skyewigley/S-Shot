<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S-Shot preview</title>
    <link rel="stylesheet" href="../styles/tailwind.css" />
  </head>
  <body class="min-h-screen bg-neutral-100 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100">
    <header class="sticky top-0 z-10 border-b border-neutral-200 bg-white/90 backdrop-blur dark:border-neutral-800 dark:bg-neutral-900/90">
      <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-3 text-sm sm:px-6">
        <svg class="h-5 w-5 shrink-0 text-indigo-600 dark:text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8h2.5l1.2-2h8.6l1.2 2H20a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" />
          <circle cx="12" cy="13.5" r="3.25" />
        </svg>
        <div class="flex min-w-0 flex-1 flex-col">
          <h1 id="title" class="truncate font-semibold tracking-tight">Loading capture…</h1>
          <span id="subtitle" class="truncate text-xs text-neutral-500 dark:text-neutral-400"></span>
        </div>
        <span id="download-status" class="hidden text-xs text-emerald-600 sm:inline dark:text-emerald-400"></span>
        <button
          id="download-all-btn"
          disabled
          class="flex shrink-0 items-center gap-2 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition-colors hover:bg-indigo-500 disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-400 dark:disabled:bg-neutral-800 dark:disabled:text-neutral-500"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14" />
          </svg>
          <span id="download-all-label">Download</span>
        </button>
      </div>
    </header>

    <main class="mx-auto flex max-w-6xl flex-col items-center gap-10 px-4 py-8 sm:px-6">
      <div id="skeleton" class="h-[70vh] w-full max-w-4xl animate-pulse rounded-lg bg-neutral-200 dark:bg-neutral-800"></div>
      <p id="error" class="hidden py-24 text-center text-sm text-neutral-500 dark:text-neutral-400"></p>
      <div id="images" class="flex w-full flex-col items-center gap-10"></div>
    </main>

    <template id="image-template">
      <figure class="flex w-full flex-col items-center gap-3">
        <img class="h-auto max-w-full rounded-md shadow-lg ring-1 ring-black/5 dark:ring-white/10" alt="" />
        <figcaption class="hidden w-full max-w-4xl items-center justify-between gap-3 text-xs text-neutral-500 dark:text-neutral-400">
          <span class="truncate" data-role="filename"></span>
          <button
            type="button"
            data-role="download"
            class="shrink-0 rounded-md px-2 py-1 font-medium text-indigo-600 transition-colors hover:bg-indigo-50 dark:text-indigo-400 dark:hover:bg-indigo-950"
          >
            Download page
          </button>
        </figcaption>
      </figure>
    </template>

    <script type="module" src="preview.js"></script>
  </body>
</html>
