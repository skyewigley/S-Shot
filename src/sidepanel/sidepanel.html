<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>K-shot</title>
    <link rel="stylesheet" href="../styles/tailwind.css" />
  </head>
  <body class="bg-white text-neutral-900 dark:bg-neutral-900 dark:text-neutral-100">
    <div class="flex flex-col gap-4 p-4 text-sm">
      <header class="flex items-center gap-2">
        <svg class="h-5 w-5 text-indigo-600 dark:text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8h2.5l1.2-2h8.6l1.2 2H20a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" />
          <circle cx="12" cy="13.5" r="3.25" />
        </svg>
        <h1 class="text-sm font-semibold tracking-tight">K-shot</h1>
      </header>

      <button
        id="capture-btn"
        class="flex w-full items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm transition-colors hover:bg-indigo-500 disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-400 dark:disabled:bg-neutral-800 dark:disabled:text-neutral-500"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8h2.5l1.2-2h8.6l1.2 2H20a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" />
          <circle cx="12" cy="13.5" r="3.25" />
        </svg>
        <span>Capture full page</span>
      </button>

      <div id="status" class="flex min-h-5 flex-col gap-1.5">
        <div class="flex items-center gap-1.5 text-xs text-neutral-500 dark:text-neutral-400">
          <span id="status-icon" class="shrink-0 empty:hidden"></span>
          <span id="status-text" class="truncate"></span>
        </div>
        <div id="progress-track" class="hidden h-1 w-full overflow-hidden rounded-full bg-neutral-200 dark:bg-neutral-700">
          <div id="progress-bar" class="h-full w-0 rounded-full bg-indigo-600 transition-all duration-200"></div>
        </div>
      </div>

      <details class="group border-t border-neutral-200 pt-3 dark:border-neutral-800">
        <summary class="flex cursor-pointer list-none items-center justify-between text-xs font-medium text-neutral-500 hover:text-neutral-700 dark:text-neutral-400 dark:hover:text-neutral-200">
          Settings
          <svg class="h-3.5 w-3.5 transition-transform group-open:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" />
          </svg>
        </summary>

        <form id="settings-form" class="mt-3 flex flex-col gap-3.5 text-xs">
          <label class="flex items-center justify-between gap-2">
            <span class="flex flex-col gap-0.5">
              <span class="font-medium text-neutral-700 dark:text-neutral-300">View first</span>
              <span class="text-[11px] text-neutral-400 dark:text-neutral-500">Open the capture in a new tab instead of downloading it</span>
            </span>
            <span class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full bg-neutral-300 p-0.5 transition-colors has-checked:bg-indigo-600 dark:bg-neutral-700">
              <input type="checkbox" id="viewFirst" class="peer absolute inset-0 h-full w-full cursor-pointer opacity-0" />
              <span class="inline-block h-5 w-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"></span>
            </span>
          </label>

          <label class="flex flex-col gap-1">
            <span class="font-medium text-neutral-700 dark:text-neutral-300">Screenshot limit</span>
            <input
              type="number"
              id="maxScreenshots"
              min="0"
              step="1"
              class="rounded-md border border-neutral-300 bg-white px-2 py-1.5 text-xs text-neutral-900 focus:border-indigo-500 focus:outline focus:outline-2 focus:outline-indigo-500/30 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-100"
            />
            <span class="text-[11px] text-neutral-400 dark:text-neutral-500">Max viewport screenshots stitched (or PDF pages). 0 = no limit</span>
          </label>

          <label class="flex flex-col gap-1">
            <span class="font-medium text-neutral-700 dark:text-neutral-300">Filename pattern</span>
            <input
              type="text"
              id="filenamePattern"
              class="rounded-md border border-neutral-300 bg-white px-2 py-1.5 text-xs text-neutral-900 focus:border-indigo-500 focus:outline focus:outline-2 focus:outline-indigo-500/30 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-100"
            />
            <span class="text-[11px] text-neutral-400 dark:text-neutral-500">Tokens: {domain} {date} {time} {title}</span>
          </label>

          <label class="flex items-center justify-between gap-2">
            <span class="font-medium text-neutral-700 dark:text-neutral-300">Auto-hide sticky headers</span>
            <span class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full bg-neutral-300 p-0.5 transition-colors has-checked:bg-indigo-600 dark:bg-neutral-700">
              <input type="checkbox" id="autoHideStickyHeaders" class="peer absolute inset-0 h-full w-full cursor-pointer opacity-0" />
              <span class="inline-block h-5 w-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"></span>
            </span>
          </label>

          <label class="flex flex-col gap-1">
            <span class="font-medium text-neutral-700 dark:text-neutral-300">Capture delay (ms)</span>
            <input
              type="number"
              id="captureDelayMs"
              min="0"
              step="50"
              class="rounded-md border border-neutral-300 bg-white px-2 py-1.5 text-xs text-neutral-900 focus:border-indigo-500 focus:outline focus:outline-2 focus:outline-indigo-500/30 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-100"
            />
          </label>

          <label class="flex flex-col gap-1">
            <span class="font-medium text-neutral-700 dark:text-neutral-300">Export scale</span>
            <select
              id="exportScale"
              class="rounded-md border border-neutral-300 bg-white px-2 py-1.5 text-xs text-neutral-900 focus:border-indigo-500 focus:outline focus:outline-2 focus:outline-indigo-500/30 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-100"
            >
              <option value="1">1x</option>
              <option value="2">2x (device pixel ratio)</option>
            </select>
          </label>

          <label class="flex flex-col gap-1">
            <span class="font-medium text-neutral-700 dark:text-neutral-300">Capture mode</span>
            <select
              id="captureMode"
              class="rounded-md border border-neutral-300 bg-white px-2 py-1.5 text-xs text-neutral-900 focus:border-indigo-500 focus:outline focus:outline-2 focus:outline-indigo-500/30 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-100"
            >
              <option value="fullPage">Full page</option>
              <option value="viewport">Visible viewport only</option>
            </select>
          </label>
        </form>
      </details>
    </div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
