name: Release

# Triggered by pushing a version tag, e.g. `npm version patch && git push --follow-tags`.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches manifest version
        run: |
          MANIFEST_VERSION="v$(node -p "require('./manifest.json').version")"
          if [ "$MANIFEST_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "S-Shot $GITHUB_REF_NAME" \
            --generate-notes
